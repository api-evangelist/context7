openapi: 3.2.0
info:
  title: Context7 Public Add Library API
  description: The Context7 Public API provides programmatic access to library documentation and search functionality. Get up-to-date documentation and code examples for any library.
  version: 2.0.0
  contact:
    name: Context7 Support
    url: https://context7.com
    email: support@context7.com
servers:
- url: https://context7.com/api
  description: Production server
tags:
- name: Add Library
  description: Submit new libraries for documentation processing
paths:
  /v2/add/repo/github:
    post:
      summary: Add a GitHub repository
      description: Submit a GitHub repository for documentation processing. Supports private repos via a gitToken or by connecting your GitHub account at https://context7.com/add-library.
      operationId: addGitHubRepo
      tags:
      - Add Library
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddRepoRequest'
            example:
              docsRepoUrl: https://github.com/vercel/next.js
      responses:
        '200':
          $ref: '#/components/responses/AddLibrarySuccess'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/DuplicateError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '504':
          $ref: '#/components/responses/GatewayTimeoutError'
      security:
      - bearerAuth: []
  /v2/add/repo/gitlab:
    post:
      summary: Add a GitLab repository
      description: Submit a GitLab repository for documentation processing. Supports private repos via a gitToken or by connecting your GitLab account at https://context7.com/add-library.
      operationId: addGitLabRepo
      tags:
      - Add Library
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddRepoRequest'
            example:
              docsRepoUrl: https://gitlab.com/owner/repo
      responses:
        '200':
          $ref: '#/components/responses/AddLibrarySuccess'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/DuplicateError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '504':
          $ref: '#/components/responses/GatewayTimeoutError'
      security:
      - bearerAuth: []
  /v2/add/repo/bitbucket:
    post:
      summary: Add a Bitbucket repository
      description: Submit a Bitbucket repository for documentation processing. Supports private repos via a gitToken or by connecting your Bitbucket account at https://context7.com/add-library.
      operationId: addBitbucketRepo
      tags:
      - Add Library
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddRepoRequest'
            example:
              docsRepoUrl: https://bitbucket.org/owner/repo
      responses:
        '200':
          $ref: '#/components/responses/AddLibrarySuccess'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/DuplicateError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '504':
          $ref: '#/components/responses/GatewayTimeoutError'
      security:
      - bearerAuth: []
  /v2/add/repo/git:
    post:
      summary: Add from other Git providers
      description: Submit a repository from any Git provider not covered by the dedicated GitHub, GitLab, or Bitbucket endpoints. Supports Gitea, Forgejo, Codeberg, self-hosted GitLab, and other Git servers. For private repos, provide a personal access token via the gitToken field.
      operationId: addGitRepo
      tags:
      - Add Library
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - docsRepoUrl
              properties:
                docsRepoUrl:
                  type: string
                  format: uri
                  description: The Git repository URL
                gitToken:
                  type: string
                  description: Personal access token for private repositories
                private:
                  type: boolean
                  description: Whether the repository is private
                skipVersionFiltering:
                  type: boolean
                  description: Skip filtering out version-specific documentation pages
                generateDocs:
                  type: boolean
                  description: Generate documentation from the repository source code. Applies to private repository submissions.
            example:
              docsRepoUrl: https://codeberg.org/owner/repo
      responses:
        '200':
          $ref: '#/components/responses/AddLibrarySuccess'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/DuplicateError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '504':
          $ref: '#/components/responses/GatewayTimeoutError'
      security:
      - bearerAuth: []
  /v2/add/openapi:
    post:
      summary: Add an OpenAPI specification by URL
      description: Submit an OpenAPI specification URL for documentation processing.
      operationId: addOpenApi
      tags:
      - Add Library
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - openApiUrl
              properties:
                openApiUrl:
                  type: string
                  format: uri
                  description: URL pointing to an OpenAPI specification (JSON or YAML)
            example:
              openApiUrl: https://api.example.com/openapi.json
      responses:
        '200':
          $ref: '#/components/responses/AddLibrarySuccess'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '504':
          $ref: '#/components/responses/GatewayTimeoutError'
      security:
      - bearerAuth: []
  /v2/add/openapi-upload:
    post:
      summary: Upload an OpenAPI specification file
      description: Upload an OpenAPI specification file (JSON or YAML) for documentation processing. Requires a team project. File size limit is 10MB.
      operationId: addOpenApiUpload
      tags:
      - Add Library
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - openapiFile
              properties:
                openapiFile:
                  type: string
                  format: binary
                  description: The OpenAPI specification file (.json, .yaml, or .yml)
                libraryTitle:
                  type: string
                  description: Custom title for the library
                description:
                  type: string
                  description: Description of the library
                force:
                  type: string
                  enum:
                  - 'true'
                  description: Set to 'true' to force reprocessing
      responses:
        '200':
          $ref: '#/components/responses/AddLibrarySuccess'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/DuplicateError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '504':
          $ref: '#/components/responses/GatewayTimeoutError'
      security:
      - bearerAuth: []
  /v2/add/pdf-upload:
    post:
      summary: Upload a PDF document
      description: Upload a PDF file for documentation processing. Requires a teamspace. File size limit is 50MB.
      operationId: addPdfUpload
      tags:
      - Add Library
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - pdfFile
              properties:
                pdfFile:
                  type: string
                  format: binary
                  description: A PDF document
                projectTitle:
                  type: string
                  description: Custom title for the library
                description:
                  type: string
                  description: Description of the library
                force:
                  type: string
                  enum:
                  - 'true'
                  description: Set to 'true' to force reprocessing
      responses:
        '200':
          $ref: '#/components/responses/AddLibrarySuccess'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          $ref: '#/components/responses/DuplicateError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '504':
          $ref: '#/components/responses/GatewayTimeoutError'
      security:
      - bearerAuth: []
  /v2/add/file-upload:
    post:
      summary: Upload documentation files
      description: Upload one or more PDF or DOCX files as one library. Supports up to 50 files, 50MB per file, and 200MB total.
      operationId: addFileUpload
      tags:
      - Add Library
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - documentFiles
              properties:
                documentFiles:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: PDF and DOCX documents
                collectionName:
                  type: string
                  description: Name for the file collection
                relativePaths:
                  type: string
                  description: JSON array of paths corresponding to documentFiles
                projectTitle:
                  type: string
                  description: Custom title for the library
                description:
                  type: string
                  description: Description of the library
                force:
                  type: string
                  enum:
                  - 'true'
                  description: Set to 'true' to force reprocessing
      responses:
        '200':
          $ref: '#/components/responses/AddLibrarySuccess'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          $ref: '#/components/responses/DuplicateError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '504':
          $ref: '#/components/responses/GatewayTimeoutError'
      security:
      - bearerAuth: []
  /v2/add/docx-upload:
    post:
      summary: Upload a Microsoft Word document
      description: Upload a DOCX file for documentation processing. Requires a teamspace. File size limit is 50MB.
      operationId: addDocxUpload
      tags:
      - Add Library
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - docxFile
              properties:
                docxFile:
                  type: string
                  format: binary
                  description: A Microsoft Word .docx file
                projectTitle:
                  type: string
                  description: Custom title for the library
                description:
                  type: string
                  description: Description of the library
                force:
                  type: string
                  enum:
                  - 'true'
                  description: Set to 'true' to force reprocessing
      responses:
        '200':
          $ref: '#/components/responses/AddLibrarySuccess'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          $ref: '#/components/responses/DuplicateError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '504':
          $ref: '#/components/responses/GatewayTimeoutError'
      security:
      - bearerAuth: []
  /v2/add/llmstxt:
    post:
      summary: Add an llms.txt file
      description: Submit an llms.txt file URL for documentation processing.
      operationId: addLlmsTxt
      tags:
      - Add Library
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - llmstxtUrl
              properties:
                llmstxtUrl:
                  type: string
                  format: uri
                  description: URL pointing to an llms.txt, llms-full.txt, or llms-small.txt file
            example:
              llmstxtUrl: https://docs.example.com/llms.txt
      responses:
        '200':
          $ref: '#/components/responses/AddLibrarySuccess'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '504':
          $ref: '#/components/responses/GatewayTimeoutError'
      security:
      - bearerAuth: []
  /v2/add/website:
    post:
      summary: Add a website
      description: Submit a website URL for documentation processing.
      operationId: addWebsite
      tags:
      - Add Library
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - websiteUrl
              properties:
                websiteUrl:
                  type: string
                  format: uri
                  description: The website URL to process
                websiteBaseUrl:
                  type: string
                  format: uri
                  description: Base URL to limit crawling scope. Only pages starting with this URL will be indexed.
            example:
              websiteUrl: https://docs.example.com
      responses:
        '200':
          $ref: '#/components/responses/AddLibrarySuccess'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          $ref: '#/components/responses/UnprocessableEntityError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '504':
          $ref: '#/components/responses/GatewayTimeoutError'
      security:
      - bearerAuth: []
  /v2/add/confluence:
    post:
      summary: Add a Confluence space
      description: Submit a Confluence space for documentation processing. Requires a connected Confluence account and a team project. You can optionally specify specific page IDs to index only a subset of the space.
      operationId: addConfluence
      tags:
      - Add Library
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - cloudId
              - siteUrl
              - spaceKey
              - spaceName
              - title
              - description
              properties:
                cloudId:
                  type: string
                  description: The Confluence cloud instance ID
                siteUrl:
                  type: string
                  description: The Confluence site URL
                spaceKey:
                  type: string
                  description: The Confluence space key
                spaceName:
                  type: string
                  description: The Confluence space name
                pageIds:
                  type: array
                  items:
                    type: string
                  description: Optional list of specific page IDs to index. If omitted, the entire space is indexed.
                title:
                  type: string
                  description: Title for the library
                description:
                  type: string
                  description: Description of the library
                projectId:
                  type: string
                  description: The team project ID to associate this Confluence space with
            example:
              cloudId: a]1b2c3d4-5e6f-7g8h-9i0j
              siteUrl: https://your-site.atlassian.net
              spaceKey: DOCS
              spaceName: Documentation
              title: My Docs
              description: Internal documentation
              projectId: project-uuid
      responses:
        '200':
          $ref: '#/components/responses/AddLibrarySuccess'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          $ref: '#/components/responses/DuplicateError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '504':
          $ref: '#/components/responses/GatewayTimeoutError'
      security:
      - bearerAuth: []
  /v2/add/notion:
    post:
      summary: Add Notion pages
      description: Submit selected Notion pages for documentation processing. Requires a connected Notion account and a team project.
      operationId: addNotion
      tags:
      - Add Library
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - workspaceId
              - workspaceName
              - pageIds
              - title
              - description
              properties:
                workspaceId:
                  type: string
                  description: The Notion workspace ID
                workspaceName:
                  type: string
                  description: The Notion workspace name
                pageIds:
                  type: array
                  items:
                    type: string
                  description: List of Notion page IDs to index.
                title:
                  type: string
                  description: Title for the library
                description:
                  type: string
                  description: Description of the library
                projectId:
                  type: string
                  description: The team project ID to associate these Notion pages with
            example:
              workspaceId: workspace-uuid
              workspaceName: Acme Workspace
              pageIds:
              - page-1
              - page-2
              title: Product Docs
              description: Internal Notion knowledge base
              projectId: project-uuid
      responses:
        '200':
          $ref: '#/components/responses/AddLibrarySuccess'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          $ref: '#/components/responses/DuplicateError'
        '429':
          $ref: '#/components/responses/RateLimitError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '504':
          $ref: '#/components/responses/GatewayTimeoutError'
      security:
      - bearerAuth: []
components:
  schemas:
    Error:
      type: object
      description: Standard error response
      properties:
        error:
          type: string
          description: Error code identifier
        message:
          type: string
          description: Human-readable error message
      required:
      - error
      - message
    AddLibraryResponse:
      type: object
      description: Response after successfully submitting a library
      properties:
        libraryName:
          type: string
          description: The library identifier assigned — the URL path of the library on context7.com. `/owner/repo` for GitHub repositories, or `/<source>/<id>` for other sources (e.g., `/vercel/next.js`, `/websites/uploadcare_com`). See [Library ID format](/api-guide#library-id-format).
        message:
          type: string
          description: Human-readable success message
      required:
      - libraryName
      - message
    AddRepoRequest:
      type: object
      description: Request body for adding a Git repository
      required:
      - docsRepoUrl
      properties:
        docsRepoUrl:
          type: string
          format: uri
          description: The repository URL
        gitToken:
          type: string
          description: Personal access token for private repositories. If not provided, the token from your OAuth connection at https://context7.com/add-library is used.
        private:
          type: boolean
          description: Whether the repository is private
        skipVersionFiltering:
          type: boolean
          description: Skip filtering out version-specific documentation pages
        generateDocs:
          type: boolean
          description: Generate documentation from the repository source code. Applies to private repository submissions.
  responses:
    BadRequestError:
      description: Bad Request - Invalid input parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            validationError:
              summary: Validation error
              value:
                error: validation_error
                message: Library name is required
            invalidLibraryId:
              summary: Invalid library ID format
              value:
                error: invalid_library_id
                message: 'Invalid library ID format. Expected: `/owner/repo` for GitHub repositories, or `/<source>/<id>` for other sources (the URL path of the library on context7.com)'
    DuplicateError:
      description: Conflict - Resource already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: duplicate_repo
            message: This private repository is already in your team
    RateLimitError:
      description: Too Many Requests - Rate limit exceeded
      headers:
        Retry-After:
          description: Seconds until rate limit resets
          schema:
            type: integer
        RateLimit-Limit:
          description: Request limit
          schema:
            type: integer
        RateLimit-Remaining:
          description: Remaining requests
          schema:
            type: integer
        RateLimit-Reset:
          description: Unix timestamp when limit resets
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: rate_limit_exceeded
            message: Rate limit exceeded. Please try again later.
    NotFoundError:
      description: Not Found - Resource doesn't exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            libraryNotFound:
              summary: Library not found
              value:
                error: library_not_found
                message: Library "/owner/repo" not found. Please check the library ID or your access permissions.
            versionNotFound:
              summary: Version not found
              value:
                error: version_not_found
                message: 'Version "v1.0.0" not found for library "/owner/repo". Available versions: v2.0.0, v1.5.0'
            noSnippetsFound:
              summary: No snippets found
              value:
                error: no_snippets_found
                message: Could not fetch documentation snippets from the library.
            noRelevantSnippets:
              summary: No snippets matched the query
              value:
                error: no_relevant_snippets
                message: No documentation in "/owner/repo" matched this query. Try a more specific query with different terms, or search for another library that covers this topic.
            teamNotFound:
              summary: Team not found
              value:
                error: team_not_found
                message: Team not found or access denied
            userNotFound:
              summary: User not found
              value:
                error: user_not_found
                message: User not found
            noLibrariesFound:
              summary: No libraries matched search query
              value:
                error: no_libraries_found
                message: No libraries found for "nonexistent-lib". Try a different search term.
    UnauthorizedError:
      description: Unauthorized - Invalid or missing API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: invalid_api_key
            message: Invalid API key. Please check your API key. API keys should start with 'ctx7sk' prefix.
    GatewayTimeoutError:
      description: Gateway Timeout - Processing timed out waiting for logs
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: timeout
            message: Request timed out. Please try again.
    AddLibrarySuccess:
      description: Library submitted successfully for processing
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AddLibraryResponse'
          example:
            libraryName: /owner/repo
            message: Repository submitted successfully
    InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: internal_error
            message: An error occurred while processing your request
    UnprocessableEntityError:
      description: Unprocessable Entity - Library is too large or has no code
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            tooLarge:
              summary: Library too large
              value:
                error: library_too_large
                message: Library /owner/repo is too large to process.
            noCode:
              summary: No code found
              value:
                error: no_code_found
                message: Library /owner/repo has no or too few snippets found in documentation files.
    ForbiddenError:
      description: Forbidden - Insufficient permissions or plan restrictions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            accessDenied:
              summary: Library not in allowed list
              value:
                error: access_denied
                message: 'Access denied: Library /owner/repo is not included in your allowed libraries'
            insufficientRole:
              summary: Insufficient team role
              value:
                error: forbidden
                message: Only team owners and admins can add private repositories
            planRequired:
              summary: Plan upgrade required
              value:
                error: forbidden
                message: Private repositories require a pro plan or team. Upgrade at https://context7.com/plans
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Get your API key at [context7.com/dashboard](https://context7.com/dashboard). Treat your API key like a password and store it securely.
