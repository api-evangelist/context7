name: Context7
description: >-
  Context7 is an Upstash service providing up-to-date, version-specific documentation and code examples for libraries
  and frameworks, exposed as both a REST API and a Model Context Protocol (MCP) server so AI coding assistants can fetch
  authoritative reference material at prompt time.
