apis:
- aid: context7:mcp-server
  name: Context7 MCP Server
  tags:
  - AI
  - Context
  - LLM
  - MCP
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://mcp.context7.com/mcp
  humanURL: https://github.com/upstash/context7
  properties:
  - url: https://github.com/upstash/context7
    type: Documentation
  - url: https://github.com/upstash/context7
    type: GitHubRepository
  description: >-
    The Context7 MCP Server implements the Model Context Protocol so AI coding assistants such as Cursor,
    Claude, and Windsurf can call Context7 tools directly from a developer's editor. It exposes resolve-library-id
    (mapping a library name to a Context7-compatible identifier) and query-docs (returning documentation
    snippets for a given library and query) and is hosted at https://mcp.context7.com/mcp with API key
    authentication.
- aid: context7:cli
  name: Context7 CLI
  tags:
  - CLI
  - Documentation
  - Tooling
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://github.com/upstash/context7
  properties:
  - url: https://github.com/upstash/context7
    type: Documentation
  - url: https://github.com/upstash/context7
    type: GitHubRepository
  description: >-
    The Context7 CLI (ctx7) is a command-line tool for querying the Context7 index from the terminal.
    It provides ctx7 library for searching the catalog by library name and ctx7 docs for retrieving documentation
    using a Context7-compatible library ID, useful for scripting and local developer workflows.
